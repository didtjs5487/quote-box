<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>문장갈피 | 마음에 남는 문장들</title>
<meta name="theme-color" content="#2B2A28">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="문장갈피">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div>
    <h1 class="brand">문장갈피</h1>
    <p class="tagline">마음에 남는 명언·명대사·명장면·건배사·개그를 모아두는 곳</p>
  </div>
  <div class="header-actions">
    <button id="btn-share" class="icon-btn" title="공유하기" aria-label="공유하기">🔗</button>
    <button id="btn-export" class="icon-btn" title="내보내기 / 가져오기" aria-label="내보내기 / 가져오기">⚙️</button>
  </div>
</header>

<main class="app-main">

  <!-- TODAY'S PICK -->
  <section id="today-pick" class="today-card hidden">
    <p class="today-label">오늘의 한마디</p>
    <p class="today-text" id="today-text"></p>
    <p class="today-source" id="today-source"></p>
    <button id="btn-shuffle" class="icon-btn" title="다른 문장 보기" aria-label="다른 문장 보기">🎲</button>
  </section>

  <!-- ADD FORM -->
  <form id="form-quote-add" class="quote-add-form">
    <textarea id="quote-text" rows="2" placeholder="마음에 남는 문장을 적어보세요…" required></textarea>
    <input type="text" id="quote-source" placeholder="출처 (선택, 예: 영화 인터스텔라, 괴테)">
    <input type="url" id="quote-link" placeholder="링크 (선택, 예: https://youtu.be/...)">
    <textarea id="quote-note" rows="2" placeholder="이 문장을 보고 느낀 점, 깨달은 것 (선택)"></textarea>
    <input type="text" id="quote-tags" placeholder="태그 (선택, 쉼표로 구분 · 예: 사랑, 위로)">
    <div class="quote-add-row2">
      <select id="quote-category">
        <option value="quote">💬 명언</option>
        <option value="line">🎬 명대사</option>
        <option value="scene">🎞️ 명장면</option>
        <option value="toast">🥂 건배사</option>
        <option value="joke">😂 개그</option>
      </select>
      <button type="submit" class="btn btn-primary">담아두기</button>
    </div>
  </form>

  <!-- SEARCH -->
  <input type="search" id="search-input" class="search-input" placeholder="검색…">

  <!-- FILTERS -->
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="quote">💬 명언</button>
    <button class="filter-btn" data-filter="line">🎬 명대사</button>
    <button class="filter-btn" data-filter="scene">🎞️ 명장면</button>
    <button class="filter-btn" data-filter="toast">🥂 건배사</button>
    <button class="filter-btn" data-filter="joke">😂 개그</button>
    <button class="filter-btn" data-filter="fav">⭐ 즐겨찾기</button>
  </div>

  <!-- TOPIC (TAG) FILTERS -->
  <div id="tag-filter-row" class="filter-row tag-filter-row hidden"></div>

  <div id="quote-list" class="quote-list"></div>
</main>

<!-- EDIT MODAL -->
<div id="modal-edit" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3>수정</h3>
      <button id="modal-edit-close" class="icon-btn" aria-label="닫기">✕</button>
    </div>
    <form id="form-quote-edit">
      <textarea id="edit-text" rows="3" required></textarea>
      <input type="text" id="edit-source" placeholder="출처 (선택)">
      <input type="url" id="edit-link" placeholder="링크 (선택, 예: https://youtu.be/...)">
      <input type="text" id="edit-tags" placeholder="태그 (선택, 쉼표로 구분 · 예: 사랑, 위로)">
      <select id="edit-category">
        <option value="quote">💬 명언</option>
        <option value="line">🎬 명대사</option>
        <option value="scene">🎞️ 명장면</option>
        <option value="toast">🥂 건배사</option>
        <option value="joke">😂 개그</option>
      </select>
      <div class="modal-actions">
        <button type="button" id="btn-delete-quote" class="btn btn-ghost">삭제</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- EXPORT / IMPORT MODAL -->
<div id="modal-backup" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3>내보내기 / 가져오기</h3>
      <button id="modal-backup-close" class="icon-btn" aria-label="닫기">✕</button>
    </div>
    <p class="hint-text">이 앱은 이 브라우저 안에만 저장돼요. 다른 기기로 옮기거나 백업해두려면 내보내기를 이용하세요.</p>
    <div class="backup-actions">
      <button id="btn-do-export" class="btn btn-secondary">📤 JSON으로 내보내기</button>
      <label class="btn btn-secondary file-label">
        📥 JSON 파일 가져오기
        <input type="file" id="import-file" accept="application/json" hidden>
      </label>
    </div>
  </div>
</div>

<!-- SHARE MODAL -->
<div id="modal-share" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3>공유하기</h3>
      <button id="modal-share-close" class="icon-btn" aria-label="닫기">✕</button>
    </div>
    <p class="hint-text">QR코드를 찍거나 링크를 보내면, 받은 사람은 자기 기기에 자신만의 문장갈피를 따로 만들 수 있어요. 서로의 문장은 섞이지 않아요.</p>
    <div id="share-qr" class="share-qr"></div>
    <div class="share-link-row">
      <input type="text" id="share-link-input" readonly>
      <button id="btn-copy-link" class="btn btn-secondary btn-small-note">복사</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
